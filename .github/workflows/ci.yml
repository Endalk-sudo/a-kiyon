name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: pnpm run lint

      - name: Index-drift guard
        run: pnpm run check-indexes

      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high

      - name: Build
        run: pnpm run build

      - name: Test (Firebase emulators)
        run: npx firebase emulators:exec --only auth,firestore "pnpm run test"
